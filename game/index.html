<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10172c">
<title>霓虹弹球 · My Website</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#f5f3ec;background:#0c1224}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{background:radial-gradient(ellipse at 50% -10%,#26396c 0,#0c1224 52%,#080d1d 100%)}button{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #ffcf79;outline-offset:3px}.app{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:15px 18px 22px;gap:11px}.top{width:min(100%,1060px);display:flex;align-items:center;justify-content:space-between;gap:12px}.back{color:#bccbe3;text-decoration:none;font-size:13px}.brand{font-weight:900;font-size:clamp(22px,3vw,34px);letter-spacing:.1em;white-space:nowrap;text-shadow:0 0 20px #75e4ff77}.brand span{color:#ffad64}.sub{color:#9fb1ce;font-size:11px;letter-spacing:.14em}.game-shell{width:min(100%,1060px);display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:18px;align-items:start}.cabinet{width:min(100%,540px);justify-self:center;border:3px solid #668ee0;border-radius:26px;padding:12px;background:linear-gradient(135deg,#26335e,#101a37 35%,#0b1634);box-shadow:0 0 0 5px #0a1025,0 22px 65px #000a,0 0 35px #477ff455}.hud{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:3px 7px 11px;font-variant-numeric:tabular-nums}.hud small{display:block;color:#9ab1d6;font-size:9px;letter-spacing:.16em}.hud strong{font-size:clamp(21px,4vw,30px);letter-spacing:.07em}.hud .balls{color:#ffc278;font-size:16px;font-weight:800}.screen{height:min(73svh,700px);min-height:440px;position:relative;overflow:hidden;border:2px solid #6c9cf3;border-radius:15px;background:#0e223f;box-shadow:inset 0 0 30px #6ecffc88,0 0 20px #447de366;touch-action:none}.screen canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;background:#0b1739b8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;backdrop-filter:blur(5px)}.overlay.hidden{display:none}.overlay .eyebrow{font-size:11px;letter-spacing:.25em;color:#7ce9ee;font-weight:800}.overlay h1{font-size:clamp(39px,7vw,70px);line-height:.92;letter-spacing:-.07em;margin:13px 0 14px;text-shadow:0 5px 20px #0008}.overlay h1 em{font-style:normal;color:#ffae73}.overlay p{font-size:14px;line-height:1.65;color:#d4e4fa;margin:0 0 22px;max-width:330px}.start{background:linear-gradient(135deg,#ffca78,#ff9163);color:#19243b;border:0;border-radius:999px;padding:13px 28px;font-weight:900;box-shadow:0 7px 0 #a75454,0 0 24px #ff9b6788;cursor:pointer}.start:active{transform:translateY(5px);box-shadow:0 2px 0 #a75454}.flash{position:absolute;top:17%;left:50%;transform:translateX(-50%) scale(.6);font-size:25px;font-weight:900;color:#ffcf78;text-shadow:0 0 18px #ff9c41;opacity:0;pointer-events:none}.flash.show{animation:pop .65s ease-out}@keyframes pop{15%{opacity:1;transform:translateX(-50%) scale(1.3)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-35px)}}.controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;margin-top:12px}.control{min-height:67px;border:2px solid #6389d8;border-radius:15px;background:linear-gradient(#263867,#18274d);color:#e9f3ff;font-size:17px;font-weight:900;touch-action:none;user-select:none;cursor:pointer;box-shadow:inset 0 1px #b8d7ff55,0 5px 0 #08112b}.control:active,.control.pressed{background:linear-gradient(#ffbf79,#e66b67);border-color:#ffd49b;color:#19253e;transform:translateY(4px);box-shadow:0 1px 0 #08112b}.launch{font-size:13px;letter-spacing:.08em;background:linear-gradient(#f9a46d,#e36c64);border-color:#ffca92;color:#1a2541}.side{padding:13px 0 0;color:#c0d0e6}.side .label{font-size:10px;font-weight:800;letter-spacing:.2em;color:#87a7d8}.side h2{font-size:24px;line-height:1.1;margin:9px 0 15px;color:#f4f5ef}.side p{font-size:13px;line-height:1.7;margin:0 0 14px}.rule{border-top:1px solid #47618c;padding:13px 0}.key{display:inline-grid;place-items:center;border:1px solid #8199c7;border-bottom-width:3px;min-width:28px;height:25px;border-radius:5px;font-size:11px;font-weight:800;margin:0 3px}.hint{color:#95abc9}.footer{width:min(100%,1060px);font-size:11px;color:#7f94b6;display:flex;justify-content:space-between;gap:14px}@media(max-width:760px){.app{padding:10px 10px 18px;gap:8px}.top{padding:0 3px}.brand{font-size:22px}.sub{display:none}.game-shell{grid-template-columns:1fr;gap:8px}.cabinet{padding:9px;border-radius:18px;max-width:500px}.screen{height:min(67svh,640px);min-height:350px}.controls{gap:7px;margin-top:10px}.control{min-height:60px;font-size:15px}.launch{font-size:12px}.side{padding:4px 8px;display:flex;align-items:center;justify-content:space-between;gap:15px}.side h2,.side .label,.side .rule{display:none}.side p{margin:0;font-size:11px}.footer{font-size:10px}}@media(max-width:390px){.screen{height:61svh;min-height:320px}.hud strong{font-size:20px}.control{min-height:56px}}@media(prefers-reduced-motion:reduce){.flash.show{animation:none;opacity:1}}
</style>
</head>
<body><main class="app">
<header class="top"><a class="back" href="/">← 返回项目主页</a><div class="brand">NEON <span>PINBALL</span></div><span class="sub">ARCADE / 01</span></header>
<div class="game-shell">
<section class="cabinet" aria-label="3D 弹球游戏">
<div class="hud"><div><small>SCORE</small><strong id="score">000000</strong></div><div><small>BEST</small><strong id="best">000000</strong></div><div><small>BALLS</small><span class="balls" id="balls">● ● ●</span></div></div>
<div class="screen" id="screen"><canvas id="canvas" aria-label="3D 弹球台"></canvas><div class="flash" id="flash">+100</div><div class="overlay" id="overlay"><span class="eyebrow" id="overlayTag">THE TABLE IS READY</span><h1 id="overlayTitle">一球<br><em>入魂.</em></h1><p id="overlayText">发射弹球，击中霓虹弹力柱。用左右挡板把它留在场上，冲击最高分。</p><button class="start" id="start">开始游戏 →</button></div></div>
<div class="controls"><button class="control" id="left" aria-label="左挡板">◀ 左挡板</button><button class="control launch" id="launch" aria-label="发射弹球">● 发射 / 空格</button><button class="control" id="right" aria-label="右挡板">右挡板 ▶</button></div>
</section>
<aside class="side"><div><span class="label">HOW TO PLAY</span><h2>别让球掉下去。</h2><p>碰撞弹力柱得分，连续击中会更爽。每局有 3 颗球。</p><div class="rule"><span class="key">←</span><span class="key">→</span> 控制挡板</div><div class="rule"><span class="key">SPACE</span> 发射下一球</div></div><p class="hint">手机上按住左右按钮，点中间发射。</p></aside>
</div><footer class="footer"><span>浏览器实时 3D 渲染 · 无账号 · 无 API</span><span>MY WEBSITE / 2026</span></footer>
</main><script type="module" src="./pinball.js"></script></body></html>
