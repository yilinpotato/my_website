    client_max_body_size 100M;

    # ===== ACME challenge (Let's Encrypt) =====
    location ^~ /.well-known/acme-challenge/ {
        root /home/myl/my_website;
        default_type "text/plain";
        try_files $uri =404;
    }

    # ===== 导航首页 =====
    root /home/myl/my_website;

    # 统一返回项目主页按钮：只由反向代理在 HTML 响应末尾挂载，不改任何项目源页面。
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '</body>' '<script>window.__SITE_ANALYTICS_CONFIG__={token:"REPLACE_WITH_POSTHOG_PROJECT_TOKEN"};</script><script src="/project-home.js?v=20260925" defer></script></body>';

    location = /project-home.js {
        root /home/myl/my_website;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=300";
    }
    location = / {
        try_files /index.html =404;
    }

    # ===== New 静态文件 =====
    location /new/static/ {
        alias /home/myl/my_website/new/myproject/static/;
        access_log off;
        expires 7d;
    }
    # ===== New 网站 =====
    location /new/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /new;
    }

    # ===== Old 静态文件 =====
    location /old/static/ {
        alias /home/myl/my_website/old/static/;
        access_log off;
        expires 7d;
    }
    # ===== Old 网站 =====
    location /old/ {
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /old;
    }

    # ===== JM漫画查看器 =====
    location /jm/ {
        proxy_pass http://127.0.0.1:5003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== QQ机器人回调 =====
    location /qq/callback {
        proxy_pass http://127.0.0.1:5003/qq/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== MyGO 静态收录站(纯静态,来源:窜子) =====
    location /mygo/ {
        alias /home/myl/my_website/mygo-site/;
        index index.html;
        try_files $uri $uri/ /mygo/index.html;
    }

    # ===== MyAgents Lite Plus（DeepSeek API + SQLite，不运行本地模型或向量库） =====
    location /myagents/api/ {
        proxy_pass http://127.0.0.1:5010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    location /myagents/ {
        alias /home/myl/my_website/myagents/lite/;
        index index.html;
        try_files $uri $uri/ /myagents/index.html;
    }

    # AI STUDY ASSISTANT
    location = /ai { return 301 /ai/; }
    location /ai/api/ {
        proxy_pass http://127.0.0.1:5012/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180;
        client_max_body_size 32M;
    }
    location /ai/assets/ {
        try_files $uri =404;
        expires 7d;
    }
    location /ai/ {
        try_files $uri $uri/ /ai/index.html;
        add_header Cache-Control "no-cache";
    }
