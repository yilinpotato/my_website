server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mayilin.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mayilin.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name mayilin.xyz www.mayilin.xyz;
    include /home/myl/my_website/nginx_site_common.conf;
    include /etc/nginx/snippets/potatoma-site-admin-https.conf;
    include /etc/nginx/snippets/potatoma-codex-reset.conf;
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(?:py|pyc|db(?:-wal|-shm)?|sqlite(?:-wal|-shm)?|sqlite3(?:-wal|-shm)?|env|pem|key|log|bak|sql|ini|toml|conf|lock)$ { return 404; }
    location /about/ { try_files $uri $uri/ =404; }
    location /game/ { try_files $uri $uri/ =404; }
    location = /home-controls.js { try_files $uri =404; }
    location = /index.html { try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; }
    location / { return 404; }
}

server {
    listen 80;
    server_name mayilin.xyz www.mayilin.xyz;
    location ^~ /.well-known/acme-challenge/ { root /home/myl/my_website; try_files $uri =404; }
    location / { return 301 https://mayilin.xyz$request_uri; }
}
